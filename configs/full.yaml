app:
  name: Sevoniva Forge
  environment: production
  region: cn-north
  zone: zone-a
server:
  listen_addr: ":8080"
  public_url: "https://forge.example.com"
  web_dir: "/app/web"
  read_timeout: 30s
  write_timeout: 30s
  idle_timeout: 60s
  shutdown_timeout: 20s
  max_body_bytes: 33554432
database:
  provider: postgres
  max_open_conns: 80
  max_idle_conns: 20
  max_lifetime: 30m
  query_timeout: 8s
  auto_migrate: true
cache:
  provider: redis
  mode: standalone
  addresses: ["redis:6379"]
  prefix: "forge:"
  default_ttl: 10m
messaging:
  provider: kafka
  brokers: ["kafka:9092"]
  client_id: forge
  tls: true
search:
  provider: elasticsearch
  urls: ["https://elasticsearch:9200"]
  tls: true
storage:
  provider: s3
  endpoint: "https://s3:9000"
  region: "us-east-1"
  bucket: forge
  path_style: true
  tls: true
discovery:
  provider: disabled
  group: DEFAULT_GROUP
  cluster: DEFAULT
remote_config:
  provider: disabled
  group: DEFAULT_GROUP
security:
  session_ttl: 8h
  secure_cookies: true
  same_site: lax
  password_min_length: 14
  password_require_upper: true
  password_require_lower: true
  password_require_digit: true
  password_require_symbol: true
  password_history: 8
  password_max_age_days: 90
  login_max_failures: 5
  login_lock_duration: 30m
  crypto_provider: standard
  crypto_key_version: v1
  allowed_origins: []
  trusted_proxies: ["10.0.0.0/8"]
observability:
  log_level: info
  log_format: json
  metrics_enabled: true
  metrics_path: /metrics
  tracing_enabled: true
  otlp_endpoint: "https://otel-collector:4318"
  otlp_tls: true
  pprof_enabled: false
resilience:
  dependency_timeout: 8s
  retry_max_attempts: 3
  retry_base_delay: 100ms
  circuit_failure_threshold: 5
  circuit_open_duration: 30s
  bulkhead_concurrency: 200
compliance:
  profile: financial
  audit_retention_days: 1095
  network_log_retention_days: 183
  sensitive_data_masking: true
  disable_debug_endpoints: true
features:
  flags: {}
