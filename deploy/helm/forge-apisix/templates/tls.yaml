{{- if .Values.enabled }}
apiVersion: apisix.apache.org/v2
kind: ApisixTls
metadata:
  name: {{ .Values.service.name }}-web-tls
spec:
  ingressClassName: {{ .Values.ingressClassName | quote }}
  hosts:
    - {{ .Values.hosts.web | quote }}
  secret:
    name: {{ required "tls.webSecretName is required" .Values.tls.webSecretName }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: apisix.apache.org/v2
kind: ApisixTls
metadata:
  name: {{ .Values.service.name }}-grpc-tls
spec:
  ingressClassName: {{ .Values.ingressClassName | quote }}
  hosts:
    - {{ .Values.hosts.grpc | quote }}
  secret:
    name: {{ required "tls.grpcSecretName is required" .Values.tls.grpcSecretName }}
    namespace: {{ .Release.Namespace }}
  {{- if .Values.tls.grpcClientMTLS.enabled }}
  client:
    caSecret:
      name: {{ required "tls.grpcClientMTLS.caSecretName is required when client mTLS is enabled" .Values.tls.grpcClientMTLS.caSecretName }}
      namespace: {{ .Release.Namespace }}
    depth: {{ .Values.tls.grpcClientMTLS.verifyDepth }}
  {{- end }}
{{- end }}
