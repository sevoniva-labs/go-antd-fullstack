# Xinchuang/financial deployment profile. This is an engineering baseline,
# not a compatibility certification for a specific OS/CPU/database combination.
replicaCount: 2
podDisruptionBudget:
  enabled: true
  minAvailable: 1

autoscaling:
  enabled: false

image:
  repository: registry.example.cn/sevoniva/forge

config:
  environment: production
  databaseProvider: oceanbase
  cacheProvider: redis
  redisMode: sentinel
  redisAddresses: "redis-sentinel-0:26379,redis-sentinel-1:26379,redis-sentinel-2:26379"
  redisMasterName: mymaster
  messagingProvider: disabled
  searchProvider: disabled
  storageProvider: s3
  storageRegion: cn-beijing
  storageBucket: forge-production
  storagePathStyle: "true"
  storageTLS: "true"

  discoveryProvider: nacos
  discoveryServiceName: forge
  nacosServers: "https://nacos.internal.example:8848"
  nacosGroup: FORGE
  nacosCluster: DEFAULT
  nacosTLSRequired: "true"
  remoteConfigProvider: nacos
  nacosConfigGroup: FORGE
  nacosConfigDataID: forge-prod.yaml
  remoteConfigFailFast: "true"

  cryptoProvider: gm
  cryptoKeyVersion: v1
  tracingEnabled: "true"
  otlpEndpoint: "https://otel-collector.monitoring.svc:4318"
  complianceProfile: financial
  auditRetentionDays: "1095"
  networkLogRetentionDays: "183"
  disableDebugEndpoints: "true"

worker:
  enabled: false

# Nacos registration needs the routable Pod IP. If your network model requires
# NodeIP/VIP/service address, override this according to the platform topology.
extraEnv:
  - name: FORGE_DISCOVERY_ADVERTISE_IP
    valueFrom:
      fieldRef:
        fieldPath: status.podIP

nodeSelector:
  kubernetes.io/os: linux
# Add verified architecture/vendor labels only after target-environment testing.
#  kubernetes.io/arch: arm64

topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: forge
