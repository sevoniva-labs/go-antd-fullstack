services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    environment:
      POSTGRES_DB: forge
      POSTGRES_USER: forge
      POSTGRES_PASSWORD: forge_dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forge -d forge"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes: ["postgres_data:/var/lib/postgresql/data"]

  redis:
    image: ${REDIS_IMAGE:-redis:8-alpine}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes: ["redis_data:/data"]

  kafka:
    image: ${KAFKA_IMAGE:-apache/kafka:4.1.0}
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20

  elasticsearch:
    image: ${ELASTICSEARCH_IMAGE:-docker.elastic.co/elasticsearch/elasticsearch:9.1.3}
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200 >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
    volumes: ["es_data:/usr/share/elasticsearch/data"]

  minio:
    image: ${MINIO_IMAGE:-minio/minio:latest}
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    volumes: ["minio_data:/data"]

  minio-init:
    image: ${MINIO_MC_IMAGE:-minio/mc:latest}
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    depends_on:
      - minio
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do sleep 2; done;
        mc mb --ignore-existing local/forge
    restart: "no"

  forge:
    build: { context: ../.., dockerfile: deploy/docker/Dockerfile }
    ports: ["8080:8080"]
    volumes: ["../../configs/full.yaml:/app/config.yaml:ro"]
    environment:
      FORGE_CONFIG: /app/config.yaml
      FORGE_DATABASE_DSN: postgres://forge:forge_dev@postgres:5432/forge?sslmode=disable
      FORGE_REDIS_ADDRESS: redis:6379
      FORGE_KAFKA_BROKERS: kafka:9092
      FORGE_SEARCH_URLS: http://elasticsearch:9200
      FORGE_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      FORGE_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      FORGE_CRYPTO_KEY: ${FORGE_CRYPTO_KEY:?set FORGE_CRYPTO_KEY in .env}
      FORGE_SECURE_COOKIES: "false"
      FORGE_PUBLIC_URL: http://localhost:8080
      FORGE_TRACING_ENABLED: "false"
      FORGE_BOOTSTRAP_ADMIN: ${FORGE_BOOTSTRAP_ADMIN:-admin}
      FORGE_BOOTSTRAP_PASSWORD: ${FORGE_BOOTSTRAP_PASSWORD:?set FORGE_BOOTSTRAP_PASSWORD in .env}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }
      elasticsearch: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }

  forge-worker:
    build: { context: ../.., dockerfile: deploy/docker/Dockerfile }
    entrypoint: ["/app/forge-worker"]
    volumes: ["../../configs/full.yaml:/app/config.yaml:ro"]
    environment:
      FORGE_CONFIG: /app/config.yaml
      FORGE_DATABASE_DSN: postgres://forge:forge_dev@postgres:5432/forge?sslmode=disable
      FORGE_REDIS_ADDRESS: redis:6379
      FORGE_KAFKA_BROKERS: kafka:9092
      FORGE_SEARCH_URLS: http://elasticsearch:9200
      FORGE_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      FORGE_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      FORGE_CRYPTO_KEY: ${FORGE_CRYPTO_KEY:?set FORGE_CRYPTO_KEY in .env}
      FORGE_TRACING_ENABLED: "false"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }

volumes:
  postgres_data:
  redis_data:
  es_data:
  minio_data:
