services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    environment:
      POSTGRES_DB: forge
      POSTGRES_USER: forge
      POSTGRES_PASSWORD: forge_dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forge -d forge"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes: ["postgres_data:/var/lib/postgresql/data"]

  redis:
    image: ${REDIS_IMAGE:-redis:8-alpine}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes: ["redis_data:/data"]

  kafka:
    image: ${KAFKA_IMAGE:-apache/kafka:4.1.0}
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20

  elasticsearch:
    image: ${ELASTICSEARCH_IMAGE:-docker.elastic.co/elasticsearch/elasticsearch:9.1.3}
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200 >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
    volumes: ["es_data:/usr/share/elasticsearch/data"]

  s3:
    image: ${S3_IMAGE:-minio/minio:latest}
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${FORGE_STORAGE_ACCESS_KEY:?set FORGE_STORAGE_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${FORGE_STORAGE_SECRET_KEY:?set FORGE_STORAGE_SECRET_KEY in .env}
    volumes: ["s3_data:/data"]

  s3-init:
    image: ${S3_MC_IMAGE:-minio/mc:latest}
    environment:
      FORGE_STORAGE_ENDPOINT: ${FORGE_STORAGE_ENDPOINT:-http://s3:9000}
      FORGE_STORAGE_BUCKET: ${FORGE_STORAGE_BUCKET:-forge}
      MINIO_ROOT_USER: ${FORGE_STORAGE_ACCESS_KEY:?set FORGE_STORAGE_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${FORGE_STORAGE_SECRET_KEY:?set FORGE_STORAGE_SECRET_KEY in .env}
      S3_BUCKET_AUTO_CREATE: ${S3_BUCKET_AUTO_CREATE:-true}
    depends_on: [s3]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        if [ "${S3_BUCKET_AUTO_CREATE:-true}" != "true" ]; then
          echo "S3 bucket auto-create disabled. Ensure bucket exists on target storage endpoint."
          exit 0
        fi
        until mc alias set local ${FORGE_STORAGE_ENDPOINT:-http://s3:9000} "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do sleep 2; done;
        mc mb --ignore-existing local/$$FORGE_STORAGE_BUCKET
    restart: "no"

  forge:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        NODE_IMAGE: ${FORGE_NODE_IMAGE:?set internal Node image digest}
        GO_IMAGE: ${FORGE_GO_IMAGE:?set internal Go image digest}
        RUNTIME_IMAGE: ${FORGE_RUNTIME_IMAGE:?set internal runtime image digest}
    ports: ["8080:8080"]
    volumes: ["../../configs/full.yaml:/app/config.yaml:ro"]
    environment:
      FORGE_CONFIG: /app/config.yaml
      FORGE_DATABASE_DSN: postgres://forge:forge_dev@postgres:5432/forge?sslmode=disable
      FORGE_REDIS_ADDRESS: redis:6379
      FORGE_KAFKA_BROKERS: kafka:9092
      FORGE_SEARCH_URLS: http://elasticsearch:9200
      FORGE_STORAGE_PROVIDER: s3
      FORGE_STORAGE_ENDPOINT: ${FORGE_STORAGE_ENDPOINT:-http://s3:9000}
      FORGE_STORAGE_REGION: ${FORGE_STORAGE_REGION:-us-east-1}
      FORGE_STORAGE_BUCKET: ${FORGE_STORAGE_BUCKET:-forge}
      FORGE_STORAGE_PATH_STYLE: ${FORGE_STORAGE_PATH_STYLE:-true}
      FORGE_STORAGE_TLS: ${FORGE_STORAGE_TLS:-false}
      FORGE_STORAGE_ACCESS_KEY: ${FORGE_STORAGE_ACCESS_KEY:?set FORGE_STORAGE_ACCESS_KEY in .env}
      FORGE_STORAGE_SECRET_KEY: ${FORGE_STORAGE_SECRET_KEY:?set FORGE_STORAGE_SECRET_KEY in .env}
      FORGE_CRYPTO_KEY: ${FORGE_CRYPTO_KEY:?set FORGE_CRYPTO_KEY in .env}
      FORGE_SECURE_COOKIES: "false"
      FORGE_PUBLIC_URL: http://localhost:8080
      FORGE_TRACING_ENABLED: "false"
      FORGE_BOOTSTRAP_ADMIN: ${FORGE_BOOTSTRAP_ADMIN:-admin}
      FORGE_BOOTSTRAP_PASSWORD: ${FORGE_BOOTSTRAP_PASSWORD:?set FORGE_BOOTSTRAP_PASSWORD in .env}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }
      elasticsearch: { condition: service_healthy }
      s3-init: { condition: service_completed_successfully }

  forge-worker:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        NODE_IMAGE: ${FORGE_NODE_IMAGE:?set internal Node image digest}
        GO_IMAGE: ${FORGE_GO_IMAGE:?set internal Go image digest}
        RUNTIME_IMAGE: ${FORGE_RUNTIME_IMAGE:?set internal runtime image digest}
    entrypoint: ["/app/forge-worker"]
    volumes: ["../../configs/full.yaml:/app/config.yaml:ro"]
    environment:
      FORGE_CONFIG: /app/config.yaml
      FORGE_DATABASE_DSN: postgres://forge:forge_dev@postgres:5432/forge?sslmode=disable
      FORGE_REDIS_ADDRESS: redis:6379
      FORGE_KAFKA_BROKERS: kafka:9092
      FORGE_SEARCH_URLS: http://elasticsearch:9200
      FORGE_STORAGE_PROVIDER: s3
      FORGE_STORAGE_ENDPOINT: ${FORGE_STORAGE_ENDPOINT:-http://s3:9000}
      FORGE_STORAGE_REGION: ${FORGE_STORAGE_REGION:-us-east-1}
      FORGE_STORAGE_BUCKET: ${FORGE_STORAGE_BUCKET:-forge}
      FORGE_STORAGE_PATH_STYLE: ${FORGE_STORAGE_PATH_STYLE:-true}
      FORGE_STORAGE_TLS: ${FORGE_STORAGE_TLS:-false}
      FORGE_STORAGE_ACCESS_KEY: ${FORGE_STORAGE_ACCESS_KEY:?set FORGE_STORAGE_ACCESS_KEY in .env}
      FORGE_STORAGE_SECRET_KEY: ${FORGE_STORAGE_SECRET_KEY:?set FORGE_STORAGE_SECRET_KEY in .env}
      FORGE_CRYPTO_KEY: ${FORGE_CRYPTO_KEY:?set FORGE_CRYPTO_KEY in .env}
      FORGE_TRACING_ENABLED: "false"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }

volumes:
  postgres_data:
  redis_data:
  es_data:
  s3_data:
