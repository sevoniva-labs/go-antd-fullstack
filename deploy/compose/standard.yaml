services:
  postgres:
    image: ${POSTGRES_IMAGE:?set POSTGRES_IMAGE to an internal Harbor digest}
    environment:
      POSTGRES_DB: forge
      POSTGRES_USER: forge
      POSTGRES_PASSWORD: forge_dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forge -d forge"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes: ["postgres_data:/var/lib/postgresql/data"]

  redis:
    image: ${REDIS_IMAGE:?set REDIS_IMAGE to an internal Harbor digest}
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes: ["redis_data:/data"]

  s3:
    image: ${S3_IMAGE:?set S3_IMAGE to an internal Harbor digest}
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${FORGE_STORAGE_ACCESS_KEY:?set FORGE_STORAGE_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${FORGE_STORAGE_SECRET_KEY:?set FORGE_STORAGE_SECRET_KEY in .env}
    ports: ["9001:9001"]
    volumes: ["s3_data:/data"]

  s3-init:
    image: ${S3_MC_IMAGE:?set S3_MC_IMAGE to an internal Harbor digest}
    environment:
      FORGE_STORAGE_ENDPOINT: ${FORGE_STORAGE_ENDPOINT:-http://s3:9000}
      FORGE_STORAGE_BUCKET: ${FORGE_STORAGE_BUCKET:-forge}
      MINIO_ROOT_USER: ${FORGE_STORAGE_ACCESS_KEY:?set FORGE_STORAGE_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${FORGE_STORAGE_SECRET_KEY:?set FORGE_STORAGE_SECRET_KEY in .env}
      S3_BUCKET_AUTO_CREATE: ${S3_BUCKET_AUTO_CREATE:-true}
    depends_on: [s3]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        if [ "${S3_BUCKET_AUTO_CREATE:-true}" != "true" ]; then
          echo "S3 bucket auto-create disabled. Ensure bucket exists on target storage endpoint."
          exit 0
        fi
        until mc alias set local ${FORGE_STORAGE_ENDPOINT:-http://s3:9000} "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do sleep 2; done;
        mc mb --ignore-existing local/$$FORGE_STORAGE_BUCKET
    restart: "no"

  forge:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        NODE_IMAGE: ${FORGE_NODE_IMAGE:?set internal Node image digest}
        GO_IMAGE: ${FORGE_GO_IMAGE:?set internal Go image digest}
        RUNTIME_IMAGE: ${FORGE_RUNTIME_IMAGE:?set internal runtime image digest}
    ports: ["8080:8080"]
    volumes: ["../../configs/standard.yaml:/app/config.yaml:ro"]
    environment:
      FORGE_CONFIG: /app/config.yaml
      FORGE_DATABASE_DSN: postgres://forge:forge_dev@postgres:5432/forge?sslmode=disable
      FORGE_REDIS_ADDRESS: redis:6379
      FORGE_STORAGE_PROVIDER: s3
      FORGE_STORAGE_ENDPOINT: ${FORGE_STORAGE_ENDPOINT:-http://s3:9000}
      FORGE_STORAGE_REGION: ${FORGE_STORAGE_REGION:-us-east-1}
      FORGE_STORAGE_BUCKET: ${FORGE_STORAGE_BUCKET:-forge}
      FORGE_STORAGE_PATH_STYLE: ${FORGE_STORAGE_PATH_STYLE:-true}
      FORGE_STORAGE_TLS: ${FORGE_STORAGE_TLS:-false}
      FORGE_STORAGE_ACCESS_KEY: ${FORGE_STORAGE_ACCESS_KEY:?set FORGE_STORAGE_ACCESS_KEY in .env}
      FORGE_STORAGE_SECRET_KEY: ${FORGE_STORAGE_SECRET_KEY:?set FORGE_STORAGE_SECRET_KEY in .env}
      FORGE_CRYPTO_KEY: ${FORGE_CRYPTO_KEY:?set FORGE_CRYPTO_KEY in .env}
      FORGE_SECURE_COOKIES: "false"
      FORGE_PUBLIC_URL: http://localhost:8080
      FORGE_BOOTSTRAP_ADMIN: ${FORGE_BOOTSTRAP_ADMIN:-admin}
      FORGE_BOOTSTRAP_PASSWORD: ${FORGE_BOOTSTRAP_PASSWORD:?set FORGE_BOOTSTRAP_PASSWORD in .env}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      s3-init: { condition: service_completed_successfully }

volumes:
  postgres_data:
  redis_data:
  s3_data:
