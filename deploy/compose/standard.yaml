services:
  postgres:
    image: ${POSTGRES_IMAGE:?set POSTGRES_IMAGE to an internal Harbor digest}
    environment:
      POSTGRES_DB: forge
      POSTGRES_USER: forge
      POSTGRES_PASSWORD: forge_dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forge -d forge"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes: ["postgres_data:/var/lib/postgresql/data"]

  redis:
    image: ${REDIS_IMAGE:?set REDIS_IMAGE to an internal Harbor digest}
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes: ["redis_data:/data"]

  forge:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        NODE_IMAGE: ${FORGE_NODE_IMAGE:?set internal Node image digest}
        GO_IMAGE: ${FORGE_GO_IMAGE:?set internal Go image digest}
        RUNTIME_IMAGE: ${FORGE_RUNTIME_IMAGE:?set internal runtime image digest}
    ports: ["8080:8080"]
    volumes: ["../../configs/standard.yaml:/app/config.yaml:ro"]
    environment:
      FORGE_CONFIG: /app/config.yaml
      FORGE_ENV: development
      FORGE_DATABASE_DSN: postgres://forge:forge_dev@postgres:5432/forge?sslmode=disable
      FORGE_REDIS_ADDRESS: redis:6379
      FORGE_REDIS_TLS: "false"
      FORGE_STORAGE_PROVIDER: s3
      FORGE_STORAGE_ENDPOINT: ${FORGE_STORAGE_ENDPOINT:?set FORGE_STORAGE_ENDPOINT to an approved S3-compatible endpoint}
      FORGE_STORAGE_REGION: ${FORGE_STORAGE_REGION:-us-east-1}
      FORGE_STORAGE_BUCKET: ${FORGE_STORAGE_BUCKET:-forge}
      FORGE_STORAGE_PATH_STYLE: ${FORGE_STORAGE_PATH_STYLE:-false}
      FORGE_STORAGE_TLS: ${FORGE_STORAGE_TLS:-false}
      FORGE_STORAGE_ACCESS_KEY: ${FORGE_STORAGE_ACCESS_KEY:?set FORGE_STORAGE_ACCESS_KEY in .env}
      FORGE_STORAGE_SECRET_KEY: ${FORGE_STORAGE_SECRET_KEY:?set FORGE_STORAGE_SECRET_KEY in .env}
      FORGE_CRYPTO_KEY: ${FORGE_CRYPTO_KEY:?set FORGE_CRYPTO_KEY in .env}
      FORGE_SECURE_COOKIES: "false"
      FORGE_PUBLIC_URL: http://localhost:8080
      FORGE_BOOTSTRAP_ADMIN: ${FORGE_BOOTSTRAP_ADMIN:-admin}
      FORGE_BOOTSTRAP_PASSWORD: ${FORGE_BOOTSTRAP_PASSWORD:?set FORGE_BOOTSTRAP_PASSWORD in .env}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

volumes:
  postgres_data:
  redis_data:
